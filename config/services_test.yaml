# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# Sobrescrituras solo para el entorno de test. Se carga después de services.yaml,
# así que prevalece sobre el autowiring por defecto de App\.
when@test:
    services:
        # En test no hay hub Mercure: el notificador publica en un doble en memoria
        # (CollectingHub) en lugar de enviar por HTTP. Así las publicaciones pueden
        # comprobarse en los tests sin un hub real. La cookie de autorización de
        # StayController::show() no se ve afectada: usa la factoría JWT real del bundle.
        App\Tests\Mercure\CollectingHub:
            public: true
            arguments:
                $url: 'http://localhost/.well-known/mercure'
                $jwtProvider: '@mercure.hub.default.jwt.provider'
                $jwtFactory: '@mercure.hub.default.jwt.factory'
                $publicUrl: '/.well-known/mercure'

        App\Service\StayRealtimeNotifier:
            arguments:
                $hub: '@App\Tests\Mercure\CollectingHub'
