site_name: Manual de usuario de Nexo FP
site_description: Gestión de la planificación y asignación de las estancias del alumnado en empresas de la FFEOE
site_url: https://reasol-edu.github.io/nexo-fp/
# Versión y fecha del release en el pie de la web. Fuente única: config/services.yaml.
# El target "docs-web" del Makefile exporta MANUAL_COPYRIGHT con app.version y
# app.pub_date; al construir directamente con mkdocs (sin la variable) se usa el valor por defecto.
copyright: !ENV [MANUAL_COPYRIGHT, "Manual de usuario de Nexo FP"]
docs_dir: .
site_dir: ../manual-site
use_directory_urls: false
repo_url: https://github.com/reasol-edu/nexo-fp

exclude_docs: |
  README.md
  requirements.txt
  _build.html
  *.pdf

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    primary: deep purple
    accent: deep purple
  icon:
      repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.integrate

extra_css:
  - assets/theme.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Introducción: index.md
  - Guía del profesorado:
      - Presentación: 10-guia-del-profesorado.md
      - Acceso a la plataforma: 11-acceso-a-la-plataforma.md
      - Flujo de trabajo: 12-flujo-de-trabajo.md
      - Pantallas de la aplicación: 13-pantallas-de-la-aplicacion.md
      - Avisos por correo: 14-avisos-por-correo.md
      - Ajustes personales: 15-ajustes-personales.md
      - Problemas de uso: 16-problemas-de-uso.md
  - Administración:
      - Presentación: 20-administracion.md
      - Roles y permisos: 21-roles-y-permisos.md
      - Primeros pasos: 22-primeros-pasos.md
      - Centro y cursos: 23-centro-y-cursos.md
      - Administración global: 24-administracion-global.md
      - Ajustes y bloqueos: 25-ajustes-y-bloqueos.md
      - Control y registro de correos: 26-control-y-registro-de-correos.md
      - Problemas de administración: 27-problemas-de-administracion.md
  - Despliegue y operación:
      - Presentación: 30-despliegue-y-operacion.md
      - Instalación y requisitos: 31-instalacion-y-requisitos.md
      - Despliegue: 32-despliegue.md
      - Configuración del correo: 33-configuracion-del-correo.md
      - Operación y mantenimiento: 34-operacion-y-mantenimiento.md
      - Comandos de consola: 35-comandos-de-consola.md
      - Resolución de problemas: 36-resolucion-de-problemas.md
  - Glosario: 99-glosario.md
