companies.xlsx.help.title: 'Cómo rellenar este libro'
companies.xlsx.help.1: 'Este libro tiene tres hojas de datos: «Empresas», «Centros de trabajo» y «Empleados». Rellene solo las que necesite; la hoja «Empresas» es imprescindible.'
companies.xlsx.help.2: 'Las columnas marcadas con * son obligatorias. No cambie el nombre de las hojas ni de las columnas, aunque sí puede cambiarlas de orden.'
companies.xlsx.help.3: 'Una fila por empresa en «Empresas». Una fila por centro de trabajo en «Centros de trabajo» y una fila por empleado en «Empleados»; en estas dos hojas, la primera columna indica a qué empresa pertenece la fila mediante su CIF/NIF.'
companies.xlsx.help.4: 'La empresa se identifica por su CIF/NIF: si ya existe en el centro se actualiza; si no, se crea. No se distingue entre mayúsculas y minúsculas ni se tienen en cuenta espacios o guiones.'
companies.xlsx.help.5: 'Al actualizar una empresa existente, una celda vacía mantiene el valor que ya tiene: dejar una celda en blanco no borra datos. Para modificar un dato, escriba el nuevo valor.'
companies.xlsx.help.6: 'Nunca se elimina nada: las empresas, centros o empleados que no aparezcan en el libro se quedan como están.'
companies.xlsx.help.7: 'Si una empresa nueva no tiene ningún centro de trabajo en la hoja «Centros de trabajo», se crea uno por defecto en su localidad.'
companies.xlsx.help.8: 'Un empleado se identifica por su DNI/NIE: si ya existe en la aplicación (por ejemplo, en otra empresa) se vincula a la empresa sin modificar sus datos.'
companies.xlsx.help.9: 'La columna «Docentes de enlace» solo es informativa y se ignora al importar; se gestiona desde la ficha de cada empresa.'
companies.xlsx.help.10: 'Escriba el CIF/NIF, los DNI/NIE y los teléfonos tal cual (si Excel los convierte en números, se importan igualmente, pero se perderían los ceros iniciales).'
companies.xlsx.help.11: 'Antes de guardar nada, la aplicación muestra un resumen de lo que se va a crear y actualizar. Si hay algún error en el libro se indica la hoja y la fila, y no se importa nada hasta corregirlo.'
companies.xlsx.help.12: 'Para volver a importar lo que ha exportado, edite el mismo libro y súbalo de nuevo.'

